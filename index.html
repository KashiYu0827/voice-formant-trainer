<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>通る声トレーナー</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a1a2e;
      color: #eee;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 40px;
      gap: 24px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #c0d4ff;
      text-align: center;
    }

    #micBtn {
      padding: 14px 40px;
      font-size: 1.05rem;
      font-weight: 600;
      border: 2px solid #4466cc;
      border-radius: 50px;
      background: transparent;
      color: #7ecfff;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
      min-width: 180px;
    }
    #micBtn:hover { background: #1e2a55; }
    #micBtn.on {
      background: #2d1a1a;
      border-color: #cc4444;
      color: #ff8888;
    }

    section {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    h2 {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #8899cc;
    }

    canvas {
      width: 100%;
      height: 120px;
      border-radius: 8px;
      background: #0d0d1e;
      display: block;
    }

    #spectrum { height: 160px; }

    /* ゲージ */
    #gaugeBar {
      width: 100%;
      height: 28px;
      background: #0d0d1e;
      border-radius: 14px;
      overflow: hidden;
      position: relative;
    }

    #gaugeFill {
      height: 100%;
      width: 0%;
      background: #6b7280;
      border-radius: 14px;
      transition: width 0.08s linear, background 0.2s;
    }

    /* 閾値マーカー（CSS変数で動的に制御） */
    :root {
      --marker-mid:  10%;
      --marker-high: 20%;
    }
    #gaugeBar::before,
    #gaugeBar::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      z-index: 2;
    }
    #gaugeBar::before {
      left: calc(var(--marker-mid) * 0.8);   /* fillPctの正規化に合わせてスケール */
      background: rgba(234, 179, 8, 0.6);
    }
    #gaugeBar::after {
      left: 80%;                              /* high_thが常に80%位置 */
      background: rgba(34, 197, 94, 0.7);
    }

    #gaugeText {
      font-size: 1.6rem;
      font-weight: 700;
      color: #6b7280;
      text-align: center;
      font-variant-numeric: tabular-nums;
      transition: color 0.2s;
    }

    #sprText {
      font-size: 0.85rem;
      color: #556699;
      text-align: center;
      font-variant-numeric: tabular-nums;
      transition: color 0.2s;
    }

    /* 持続グロー */
    #gaugeBar {
      transition: box-shadow 0.3s;
    }
    #gaugeBar.sustained {
      box-shadow: 0 0 18px rgba(34, 197, 94, 0.55);
    }

    #sustainedLabel {
      font-size: 0.8rem;
      color: #22c55e;
      text-align: center;
      min-height: 1.2em;
      transition: opacity 0.3s;
      opacity: 0;
    }
    #sustainedLabel.visible {
      opacity: 1;
    }

    .hint {
      font-size: 0.78rem;
      color: #6b7280;
      text-align: center;
    }

    .marker-legend {
      display: flex;
      gap: 16px;
      justify-content: center;
      font-size: 0.75rem;
      color: #888;
    }
    .marker-legend span { display: flex; align-items: center; gap: 4px; }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    .dot-yellow { background: #eab308; }
    .dot-green  { background: #22c55e; }

    /* モードトグル */
    .mode-toggle {
      display: flex;
      border: 1px solid #334477;
      border-radius: 20px;
      width: fit-content;
      margin: 0 auto;
      gap: 2px;
      padding: 2px;
    }
    .mode-btn {
      padding: 8px 20px;
      font-size: 0.8rem;
      font-weight: 600;
      background: transparent;
      color: #556699;
      border: none;
      border-radius: 18px;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: rgba(126, 207, 255, 0.2);
      transition: background 0.2s, color 0.2s;
      white-space: nowrap;
      min-width: 80px;
      min-height: 44px;
    }
    .mode-btn.active {
      background: #1e2a55;
      color: #7ecfff;
    }

    /* スペクトル アコーディオン */
    #spectrumSection {
      cursor: pointer;
      user-select: none;
    }

    #spectrumHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 0;
    }

    #spectrumToggle {
      font-size: 0.75rem;
      color: #556699;
      transition: transform 0.25s;
      display: inline-block;
    }
    #spectrumSection.open #spectrumToggle {
      transform: rotate(180deg);
    }

    #spectrumBody {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.28s ease;
    }
    #spectrumSection.open #spectrumBody {
      grid-template-rows: 1fr;
    }

    #spectrumInner {
      overflow: hidden;
    }

    #spectrum {
      height: 160px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <h1>🎙️ 通る声トレーナー</h1>

  <button id="micBtn">マイク ON</button>

  <div class="mode-toggle">
    <button class="mode-btn active" data-mode="singing">歌声 ♪</button>
    <button class="mode-btn" data-mode="speech">話し声 ◎</button>
  </div>

  <section>
    <h2>波形</h2>
    <canvas id="waveform"></canvas>
  </section>

  <section>
    <h2 id="gaugeLabel">Singer's Formant（2500–3500 Hz）</h2>
    <div id="gaugeBar">
      <div id="gaugeFill"></div>
    </div>
    <div id="gaugeText">0%</div>
    <div id="sprText">SPR —</div>
    <div id="sustainedLabel">通る声キープ中 ✦</div>
    <div class="marker-legend">
      <span><span class="dot dot-yellow"></span>10% — 黄ゾーン</span>
      <span><span class="dot dot-green"></span>20% — 通る声ゾーン</span>
    </div>
    <p class="hint">20%以上で「通る声」ゾーン</p>
  </section>

  <section id="spectrumSection">
    <div id="spectrumHeader">
      <h2>スペクトル（詳細）</h2>
      <span id="spectrumToggle">▼</span>
    </div>
    <div id="spectrumBody">
      <div id="spectrumInner">
        <canvas id="spectrum"></canvas>
      </div>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
